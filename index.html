<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' services.nvd.nist.gov www.cisa.gov raw.githubusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>AppSec Intel Hub</title>
<style>
:root{
  --bg:#080e1a;--panel:#0d1424;--soft:#1a2540;--border:#1e2d48;
  --accent:#10d9a0;--accent2:#3b82f6;--text:#e2e8f0;--muted:#7a90b0;
  --muted2:#94a3b8;--sub:#c4d3e8;--card-bg:#0b1628;
  --panel2:#0a1020;--border2:#2d4060;--yellow:#eab308;--green:#22c55e;--red:#ef4444;
  --ih-accent:#f59e0b;--ih-accent2:#d97706;--ih-glow:rgba(245,158,11,.18);
  --cwe-accent:#6366f1;--cwe-glow:rgba(99,102,241,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.6 'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.ih-topbar{height:46px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.ih-topbar-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 10px var(--ih-glow)}
.ih-topbar-title{font-size:14px;font-weight:800;letter-spacing:-.2px}
.ih-topbar-sub{font-size:11px;color:var(--muted)}
.ih-topbar-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:4px;background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));color:#000;letter-spacing:.05em;margin-left:4px}
.ih-topbar-live{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;color:#22c55e;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);border-radius:4px;padding:1px 6px;margin-left:auto}
.ih-topbar-live-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:ihBlink 1.2s step-start infinite}
.content{flex:1;overflow:hidden;padding:22px 24px}
/* ── AppSec Intel Hub ── */
:root{--ih-accent:#f59e0b;--ih-accent2:#d97706;--ih-glow:rgba(245,158,11,.18)}
.ih-dot{width:5px;height:5px;border-radius:50%;background:var(--ih-accent);animation:ihBlink 1.2s step-start infinite}
@keyframes ihBlink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes ihPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--ih-glow)}50%{opacity:.7;box-shadow:0 0 0 5px transparent}}
/* Sidebar brand card */
.ih-sb-card{display:flex;align-items:center;gap:10px;margin:10px 10px 8px;padding:11px 12px;background:linear-gradient(135deg,rgba(245,158,11,.07),rgba(217,119,6,.04));border:1px solid rgba(245,158,11,.22);border-radius:11px;cursor:pointer;transition:all .2s;user-select:none}
.ih-sb-card:hover{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(217,119,6,.1));border-color:rgba(245,158,11,.5);box-shadow:0 0 18px rgba(245,158,11,.12)}
.ih-sb-card.active{border-color:var(--ih-accent);box-shadow:0 0 22px var(--ih-glow);background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(217,119,6,.08))}
.ih-sb-icon{width:34px;height:34px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 0 12px rgba(59,130,246,.35)}
.ih-sb-body{flex:1;min-width:0}
.ih-sb-title{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--text);letter-spacing:-.2px;line-height:1.3}
.ih-sb-live-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;letter-spacing:.05em;color:#22c55e;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);border-radius:4px;padding:1px 5px;animation:ihPulse 2.5s ease-in-out infinite}
.ih-sb-live-dot{width:4px;height:4px;border-radius:50%;background:#22c55e;animation:ihBlink 1.2s step-start infinite;flex-shrink:0}
.ih-sb-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.ih-sb-arrow{color:var(--muted);font-size:18px;flex-shrink:0;transition:transform .2s,color .2s}
.ih-sb-card:hover .ih-sb-arrow,.ih-sb-card.active .ih-sb-arrow{color:var(--ih-accent);transform:translateX(2px)}
/* Hub main view */
.ih-wrap{max-width:900px;padding:4px 0 28px}
.ih-title-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.ih-title-row h2{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:0}
.ih-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));color:#000;letter-spacing:.05em}
.ih-sub{font-size:12px;color:var(--muted);margin-left:auto}
.ih-search-row{display:flex;gap:8px;margin-bottom:14px}
.ih-input{flex:1;background:var(--panel);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:13.5px;padding:9px 14px;font-family:inherit;outline:none;transition:border-color .2s}
.ih-input:focus{border-color:var(--ih-accent);box-shadow:0 0 0 3px var(--ih-glow)}
.ih-btn{background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));border:none;border-radius:10px;color:#000;font-size:13px;font-weight:700;padding:9px 18px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform .15s,opacity .15s}
.ih-btn:hover{opacity:.88;transform:scale(1.02)}
.ih-btn.sec{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.ih-btn.sec:hover{border-color:var(--ih-accent);color:var(--ih-accent)}
.ih-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ih-chip{background:var(--soft);border:1px solid var(--border);border-radius:20px;font-size:11.5px;padding:5px 13px;cursor:pointer;color:var(--text);transition:all .15s;font-family:inherit}
.ih-chip:hover{border-color:var(--ih-accent);color:var(--ih-accent);background:var(--ih-glow)}
.ih-results{display:flex;flex-direction:column;gap:10px}
/* ── Intel Hub Two-Column Layout ── */
.ih-layout{display:flex;height:calc(100vh - 90px);margin:-22px -24px;overflow:hidden}
.ih-sub-nav{width:210px;min-width:180px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:0 0 16px;flex-shrink:0}
.ih-sub-nav::-webkit-scrollbar{width:3px}
.ih-sub-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.ih-sub-nav-brand{padding:14px 12px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.ih-sub-nav-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;box-shadow:0 0 10px var(--ih-glow)}
.ih-sub-nav-title{font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.ih-sub-nav-subtitle{font-size:10px;color:var(--muted);margin-top:1px}
.ih-nav-group{margin-top:12px;padding:0 8px}
.ih-nav-group-label{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);padding:0 8px;margin-bottom:4px}
.ih-nav-item{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--muted);font:12.5px 'Segoe UI',system-ui,sans-serif;padding:8px 10px;cursor:pointer;text-align:left;transition:all .15s;margin-bottom:2px}
.ih-nav-item:hover{background:var(--soft);color:var(--text)}
.ih-nav-item.active{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--ih-accent);font-weight:600}
.ih-nav-item.active.cwe-mode{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.3);color:#6366f1}
.ih-nav-item.active.api-mode{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#22c55e}
.ih-nav-item.active.llm-mode{background:rgba(236,72,153,.1);border-color:rgba(236,72,153,.3);color:#ec4899}
.ih-nav-item.active.nist-mode{background:rgba(6,182,212,.1);border-color:rgba(6,182,212,.3);color:#06b6d4}
.ih-nav-item.active.sans-mode{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.3);color:#f97316}
.ih-nav-ico{width:16px;text-align:center;flex-shrink:0}
.ih-nav-badge{margin-left:auto;font-size:9px;font-weight:700;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.28);border-radius:6px;padding:1px 7px;color:#818cf8}
.ih-live-pill{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;letter-spacing:.04em;color:var(--ih-accent);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);border-radius:4px;padding:1px 5px}
.ih-live-dot2{width:4px;height:4px;border-radius:50%;background:var(--ih-accent);animation:ihBlink 1.2s step-start infinite;flex-shrink:0}
.ih-nav-divider{height:1px;background:var(--border);margin:10px 8px}
.ih-nav-group-title{display:flex;align-items:center;gap:8px;padding:7px 10px 5px;font-size:12px;font-weight:700;color:var(--text);letter-spacing:-.1px}
.ih-nav-sub{padding-left:20px;font-size:12px}
.ih-nav-sub-arrow{font-size:12px;opacity:.45;flex-shrink:0;margin-right:2px}
.ih-ws-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.ih-ws-topbar{padding:12px 20px 10px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;gap:8px;align-items:center;flex-shrink:0}
.ih-ws-search{flex:1;margin-bottom:0}
.ih-ws-chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.ih-ws-body{flex:1;overflow-y:auto;padding:18px 20px}
.ih-ws-body::-webkit-scrollbar{width:5px}
.ih-ws-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
/* CVE Card */
.cve-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.cve-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--ih-accent),var(--ih-accent2))}
.cve-card:hover{border-color:var(--ih-accent);box-shadow:0 4px 24px var(--ih-glow)}
.cve-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.cve-id{font-size:13px;font-weight:800;font-family:monospace;color:var(--ih-accent);flex-shrink:0}
.cve-title{font-size:13px;font-weight:600;line-height:1.4;flex:1}
.cve-sev{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.05em;flex-shrink:0;align-self:flex-start}
.cve-sev.CRITICAL{background:#7f1d1d;color:#fca5a5}
.cve-sev.HIGH{background:#78350f;color:#fcd34d}
.cve-sev.MEDIUM{background:#713f12;color:#fde68a}
.cve-sev.LOW{background:#1e3a2f;color:#6ee7b7}
.cve-sev.NONE,.cve-sev.UNKNOWN{background:var(--soft);color:var(--muted)}
.cve-desc{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cve-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.cve-chip{font-size:10.5px;padding:2px 8px;border-radius:5px;background:var(--soft);border:1px solid var(--border);color:var(--text);font-family:monospace}
.cve-chip.kev{background:#7f1d1d;border-color:#ef4444;color:#fca5a5;font-family:inherit;font-weight:700;animation:ihPulse 2s ease-in-out infinite}
.cve-chip.kev .ih-dot{background:#ef4444}
.cve-cvss{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cve-cvss-label{font-size:11px;color:var(--muted);white-space:nowrap}
.cve-cvss-bar{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.cve-cvss-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.cve-cvss-score{font-size:12px;font-weight:700;white-space:nowrap}
.cve-actions{display:flex;gap:8px;flex-wrap:wrap}
.cve-actions button{font-size:11px;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--soft);color:var(--text);cursor:pointer;font-family:inherit;transition:all .15s}
.cve-actions button:hover{border-color:var(--ih-accent);color:var(--ih-accent)}
.cve-actions button.primary{background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));border:none;color:#000;font-weight:700}
.cve-actions button.primary:hover{opacity:.88;transform:scale(1.02)}
.kev-detail{margin-top:8px;padding:8px 12px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.3);border-radius:8px;font-size:11px;color:#fca5a5;display:none}
.kev-detail.show{display:block}
/* Loading / empty states */
.ih-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 0;color:var(--muted)}
.ih-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--ih-accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ih-empty{text-align:center;padding:40px 0;color:var(--muted);font-size:13px}
.ih-error{text-align:center;padding:30px 0;font-size:13px;color:#ef4444}
.ih-error-hint{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6}
.ih-section-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
/* KEV Reference page */
.ih-kev-ref{background:var(--panel);border:1px solid rgba(239,68,68,.3);border-radius:14px;padding:28px 28px 24px;max-width:640px;margin:0 auto}
.ih-kev-ref-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.ih-kev-ref-icon{font-size:32px;flex-shrink:0;margin-top:2px}
.ih-kev-ref-header h3{font-size:18px;font-weight:800;margin:0 0 4px;color:var(--text)}
.ih-kev-ref-header p{font-size:12px;color:var(--muted);margin:0}
.ih-kev-ref-desc{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:18px}
.ih-kev-ref-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.ih-kev-ref-stat{background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.ih-kev-ref-stat span{display:block;font-size:20px;font-weight:800;color:var(--ih-accent)}
.ih-kev-ref-stat label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ih-kev-ref-note{font-size:12px;color:#f97316;background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.3);border-radius:8px;padding:9px 13px;margin-bottom:16px}
.ih-kev-ref-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ih-kev-ref-actions a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:10px;font-size:13px;font-weight:700;padding:9px 18px;font-family:inherit;transition:opacity .15s,transform .15s}
.ih-kev-ref-actions a.ih-btn{background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));color:#000}
.ih-kev-ref-actions a.ih-btn:hover{opacity:.88;transform:scale(1.02)}
.ih-kev-ref-actions a.ih-btn.sec{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.ih-kev-ref-actions a.ih-btn.sec:hover{border-color:var(--ih-accent);color:var(--ih-accent)}
.ih-kev-ref-tip{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 14px;line-height:1.5}
/* Trending welcome cards */
.ih-welcome{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.ih-welcome-card{background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.ih-welcome-card:hover{border-color:var(--ih-accent);background:var(--ih-glow)}
.ih-welcome-card-title{font-size:12.5px;font-weight:700;margin-bottom:4px}
.ih-welcome-card-sub{font-size:11px;color:var(--muted)}
/* KEV list entries */
.kev-entry{background:var(--panel);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:5px}
.kev-entry-top{display:flex;align-items:center;gap:10px}
.kev-cve-id{font-size:12px;font-weight:800;font-family:monospace;color:#ef4444}
.kev-name{font-size:12.5px;font-weight:600;flex:1}
.kev-date{font-size:10px;color:var(--muted);white-space:nowrap}
.kev-product{font-size:11px;color:var(--muted)}
/* Sidebar icon in hub group */
.ih-sidebar-btn{width:100%;background:none;border:none;display:flex;align-items:center;gap:9px;padding:7px 14px;cursor:pointer;border-radius:7px;color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;transition:background .15s,color .15s;text-align:left}
.ih-sidebar-btn:hover{background:var(--soft);color:var(--ih-accent)}
.ih-sidebar-btn.active{background:var(--ih-glow);color:var(--ih-accent)}
/* ── CWE Taxonomy Browser ── */
:root{--cwe-accent:#6366f1;--cwe-glow:rgba(99,102,241,.15)}
.cwe-browser{max-width:900px;padding:4px 0 28px}
.cwe-owasp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.cwe-owasp-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 15px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.cwe-owasp-card:hover{border-color:var(--cwe-accent);box-shadow:0 2px 14px var(--cwe-glow)}
.cwe-owasp-hdr{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:7px}
.cwe-owasp-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;border:1px solid;flex-shrink:0}
.cwe-owasp-chips{display:flex;flex-wrap:wrap;gap:5px}
.cwe-mini-chip{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-family:monospace;transition:opacity .1s}
.cwe-mini-chip:hover{opacity:.75}
.cwe-mini-chip.cwe-more{color:#6366f1;font-family:inherit;cursor:pointer;border:1px solid rgba(99,102,241,.35);font-weight:700;transition:all .15s}
.cwe-mini-chip.cwe-more:hover{background:rgba(99,102,241,.1)}
.cwe-back-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:7px;cursor:pointer;margin-bottom:14px;font-family:inherit;transition:all .15s}
.cwe-back-btn:hover{border-color:var(--cwe-accent);color:var(--cwe-accent)}
.cwe-detail-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;position:relative;overflow:hidden}
.cwe-detail-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cwe-accent),#8b5cf6)}
.cwe-detail-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cwe-detail-id{font-size:16px;font-weight:900;font-family:monospace;color:var(--cwe-accent)}
.cwe-detail-name{font-size:19px;font-weight:800;margin-bottom:10px;line-height:1.3}
.cwe-detail-desc{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:14px;padding:10px 14px;background:var(--soft);border-radius:8px;border-left:3px solid var(--cwe-accent)}
.cwe-rel-section{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.cwe-rel-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
/* Taxonomy tabs */
.cwe-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.cwe-tab{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;font-weight:600}
.cwe-tab:hover{background:var(--soft);color:var(--text)}
.cwe-tab.active-wa{background:#6366f1;border-color:#6366f1;color:#fff}
.cwe-tab.active-api{background:#16a34a;border-color:#22c55e;color:#fff}
.cwe-tab.active-llm{background:#9d174d;border-color:#ec4899;color:#fff}
.cwe-tab.active-sans{background:#c2410c;border-color:#f97316;color:#fff}
/* OWASP change badges */
.owasp-change-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;display:inline-block}
.owasp-change-badge.new{background:#16a34a15;border:1px solid #16a34a50;color:#16a34a}
.owasp-change-badge.renamed{background:#f9731615;border:1px solid #f9731650;color:#f97316}
.owasp-change-badge.same{background:var(--soft);border:1px solid var(--border);color:var(--muted)}
.owasp-change-note{font-size:11.5px;color:var(--muted);background:var(--soft);padding:8px 12px;border-radius:7px;margin-bottom:12px;border-left:3px solid var(--border);line-height:1.5}
.owasp-card-desc{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ── Detail Tab UI ── */
.cwe-det-hdr{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:4px;position:relative;overflow:hidden}
.cwe-det-hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cwe-accent),#8b5cf6)}
.cwe-det-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:14px 0 18px}
.cwe-det-tab{padding:9px 18px;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:all .15s;position:relative;top:1px;white-space:nowrap}
.cwe-det-tab:hover{color:var(--sub)}
.cwe-det-tab.active{color:var(--cwe-accent);border-bottom-color:var(--cwe-accent)}
.cwe-det-panel{display:none}
.cwe-det-panel.active{display:block;animation:cdetFd .18s ease}
@keyframes cdetFd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.cwe-det-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px;transition:border-color .15s}
.cwe-det-card:last-child{margin-bottom:0}
.det-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.det-kv{display:flex;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px;gap:8px}
.det-kv:last-child{border-bottom:none}
.det-kv-key{color:var(--muted);flex-shrink:0;padding-top:1px}
.det-kv-val{margin-left:auto;font-weight:600;color:var(--text);text-align:right;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.det-flow{display:flex;align-items:center;overflow-x:auto;padding:12px 0 16px;scrollbar-width:none}
.det-flow::-webkit-scrollbar{display:none}
.det-flow-node{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:88px}
.det-flow-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid;transition:box-shadow .2s;cursor:default}
.det-flow-icon:hover{box-shadow:0 0 16px currentColor}
.det-flow-label{font-size:10px;font-weight:600;color:var(--sub);text-align:center;line-height:1.35}
.det-flow-sub{font-size:9px;color:var(--muted);text-align:center;line-height:1.3;margin-top:2px}
.det-flow-arrow{font-size:15px;color:var(--border2);padding:0 4px;flex-shrink:0;margin-bottom:28px}
.det-code{background:#060910;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font:11.5px/1.7 'Courier New',monospace;color:#a5f3fc;overflow-x:auto;white-space:pre-wrap}
.det-impact-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(239,68,68,.05);border-radius:7px;border:1px solid rgba(239,68,68,.12);font-size:12.5px;margin-bottom:6px}
.det-impact-row:last-child{margin-bottom:0}
.det-impact-x{color:var(--red);font-size:15px;flex-shrink:0}
.det-scenario{background:var(--panel2);border:1px solid var(--border);border-left:3px solid rgba(239,68,68,.45);border-radius:8px;padding:11px 14px;margin-bottom:8px;font-size:12.5px;color:var(--sub);line-height:1.5}
.det-scenario:last-child{margin-bottom:0}
.det-fix-step{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.det-fix-step:last-child{border-bottom:none;padding-bottom:0}
.det-fix-num{width:26px;height:26px;border-radius:50%;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);color:var(--cwe-accent);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.det-fix-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.det-fix-desc{font-size:12.5px;color:var(--sub);line-height:1.6}
.det-fix-hint{font-size:11.5px;color:var(--muted);margin-top:5px;padding:6px 10px;background:var(--soft);border-radius:6px;font-family:'Courier New',monospace}
.det-bar-row{margin-bottom:12px}
.det-bar-head{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:5px}
.det-bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.det-bar-fill{height:100%;border-radius:3px}
.det-sev-circle{width:82px;height:82px;border-radius:50%;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.det-sev-letter{font-size:28px;font-weight:900;line-height:1}
.det-sev-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.det-risk-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;transition:border-color .15s}
.det-risk-card:hover{border-color:var(--border2)}
@media(max-width:820px){.det-grid-2{grid-template-columns:1fr}}
.cwe-chip-link{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--cwe-accent);color:var(--cwe-accent);background:var(--cwe-glow);cursor:pointer;font-family:monospace;transition:opacity .15s}
.cwe-chip-link:hover{opacity:.75}
/* CVE → Playbook links panel */
.cve-playbook-panel{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:8px;border:1px solid var(--border)}
.cve-plink-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.cve-plink-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.cve-plink-item:last-child{border-bottom:none}
.cve-plink-name{font-size:12px;font-weight:600;flex:1}
.cve-plink-src{font-size:10px;color:var(--muted);white-space:nowrap}
/* Standards row on CVE cards */
.cve-standards{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.cve-std-label{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.cve-std-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;cursor:pointer;transition:opacity .15s;border:1px solid}
.cve-std-badge:hover{opacity:.75}
.cve-std-badge.wa{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.4);color:#818cf8}
.cve-std-badge.api{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35);color:#4ade80}
.cve-std-badge.llm{background:rgba(236,72,153,.1);border-color:rgba(236,72,153,.35);color:#f472b6}
.cve-std-badge.sans{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.35);color:#fb923c}
/* SANS Top 25 browser */
.sans-rank-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-size:13px;font-weight:900;flex-shrink:0}
.sans-card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;transition:border-color .2s,box-shadow .2s;cursor:pointer}
.sans-card:hover{border-color:#f97316;box-shadow:0 4px 20px rgba(249,115,22,.15)}
.sans-card-body{min-width:0}
.sans-card-name{font-size:13px;font-weight:700;margin-bottom:3px}
.sans-card-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sans-score{font-size:18px;font-weight:900;color:#f97316;white-space:nowrap}
/* ── Finding Panel ── */
#findingPanel{display:none;position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100vw;background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(0,0,0,.45);z-index:1000;flex-direction:column}
#findingPanel.open{display:flex}
.fp-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.fp-head h3{flex:1;font-size:14px;font-weight:800;letter-spacing:-.2px;margin:0}
.fp-copy-btn{background:linear-gradient(135deg,var(--ih-accent),var(--ih-accent2));border:none;border-radius:8px;color:#000;font-size:12px;font-weight:700;padding:6px 14px;cursor:pointer;font-family:inherit}
.fp-copy-btn:hover{opacity:.85}
.fp-close-btn{background:var(--soft);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit;margin-left:4px}
.fp-close-btn:hover{color:var(--text);border-color:var(--text)}
.fp-body{flex:1;overflow-y:auto;padding:18px 20px}
.fp-body::-webkit-scrollbar{width:5px}
.fp-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.fp-content{font-size:12.5px;line-height:1.75;color:var(--text);white-space:pre-wrap;font-family:'Segoe UI',system-ui,sans-serif}
.fp-spinner{display:flex;align-items:center;gap:10px;padding:32px 0;color:var(--muted);font-size:13px}
.fp-spinner-ring{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--ih-accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="ih-topbar">
    <div class="ih-topbar-icon">🛡️</div>
    <div class="ih-topbar-title">AppSec Intel Hub</div>
    <div class="ih-topbar-sub">Security Intelligence Platform</div>
    <span class="ih-topbar-badge">LIVE</span>
    <span class="ih-topbar-live"><span class="ih-topbar-live-dot"></span>NVD · CISA KEV</span>
  </header>
  <div class="content">
    <div id="chipsBar" style="display:none"></div>
    <div id="card"></div>
  </div>
</div>
<!-- Finding Panel (slide-in) -->
<div id="findingPanel">
  <div class="fp-head">
    <h3 id="fpTitle">✍️ Security Finding</h3>
    <button class="fp-copy-btn" onclick="window.fpCopy()">📋 Copy</button>
    <button class="fp-close-btn" onclick="window.fpClose()">✕ Close</button>
  </div>
  <div class="fp-body">
    <div id="fpBody"></div>
  </div>
</div>
<script>
(function(){
  'use strict';

  /* ── Config ── */
  const NVD_API  = 'https://services.nvd.nist.gov/rest/json/cves/2.0';
  const KEV_URL  = 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json';
  const NVD_DELAY = 700; /* ms between NVD calls to respect 5 req/30 s limit */

  /* ── State ── */
  let kevIndex   = null;   /* {[cveId]: entry} */
  let kevList    = [];     /* sorted by dateAdded desc */
  let kevPromise = null;   /* singleton in-flight Promise — prevents double-fetch */
  let kevReady   = false;
  let kevError   = null;   /* error string if KEV load failed, null if ok */
  let ihActive   = false;

  /* ── Helpers ── */
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function cvssColor(score){
    const n = parseFloat(score);
    if (isNaN(n)) return '#6b7280';
    if (n >= 9)  return '#ef4444';
    if (n >= 7)  return '#f97316';
    if (n >= 4)  return '#eab308';
    return '#22c55e';
  }

  function sevClass(sev){
    const s = (sev||'').toUpperCase();
    return ['CRITICAL','HIGH','MEDIUM','LOW','NONE'].includes(s) ? s : 'UNKNOWN';
  }

  /* ── KEV loader — always resolves, never throws (NVD features must never be blocked by KEV) ── */
  function loadKEV(){
    if (kevReady)   return Promise.resolve();
    if (kevPromise) return kevPromise;   /* already in-flight — reuse same Promise */
    kevPromise = (async () => {
      try {
        const r = await fetch(KEV_URL);
        if (!r.ok) throw new Error('CISA server returned HTTP ' + r.status);
        const data = await r.json();
        const vulns = data.vulnerabilities || [];
        kevList  = [...vulns].sort((a,b)=> (b.dateAdded||'').localeCompare(a.dateAdded||''));
        kevIndex = Object.fromEntries(vulns.map(v => [v.cveID, v]));
        kevReady = true;
        kevError = null;
      } catch(e){
        kevError   = e.message;
        kevPromise = null;   /* clear so user can retry by clicking again */
        console.warn('[IntelHub] KEV unavailable:', e.message);
        /* intentionally does NOT rethrow — callers must check kevError if needed */
      }
    })();
    return kevPromise;
  }

  /* ── NVD fetch helpers ── */
  async function nvdFetch(params){
    const url = NVD_API + '?' + new URLSearchParams(params).toString();
    const r = await fetch(url);
    if (!r.ok) throw new Error('NVD API error ' + r.status);
    return r.json();
  }

  async function nvdById(cveId){
    const data = await nvdFetch({ cveId });
    return (data.vulnerabilities || [])[0]?.cve || null;
  }

  async function nvdSearch(keyword, maxResults = 8){
    const data = await nvdFetch({ keywordSearch: keyword, resultsPerPage: maxResults });
    return (data.vulnerabilities || []).map(v => v.cve);
  }

  async function nvdRecentCritical(){
    const end   = new Date();
    const start = new Date(end);
    start.setDate(start.getDate() - 30);
    const fmt = d => d.toISOString().replace(/\.\d+Z$/,'Z');
    const data = await nvdFetch({
      cvssV3Severity: 'CRITICAL',
      pubStartDate: fmt(start),
      pubEndDate:   fmt(end),
      resultsPerPage: 10
    });
    return (data.vulnerabilities || []).map(v => v.cve);
  }

  /* ── CVE Card renderer ── */
  function renderCVECard(cve, idx){
    const id    = cve.id || '';
    const descs = cve.descriptions || [];
    const desc  = (descs.find(d=>d.lang==='en')||descs[0]||{}).value || 'No description available.';
    const title = desc.slice(0,120) + (desc.length > 120 ? '…' : '');
    const metrics= cve.metrics || {};
    const cvssData = (metrics.cvssMetricV31||metrics.cvssMetricV30||metrics.cvssMetricV2||[])[0]?.cvssData || {};
    const score = cvssData.baseScore != null ? cvssData.baseScore : null;
    const sev   = (metrics.cvssMetricV31||metrics.cvssMetricV30||[])[0]?.cvssData?.baseSeverity
                  || (score != null ? (score>=9?'CRITICAL':score>=7?'HIGH':score>=4?'MEDIUM':'LOW') : 'UNKNOWN');
    const cwes  = (cve.weaknesses||[]).flatMap(w=>w.description||[]).filter(d=>d.lang==='en').map(d=>d.value).slice(0,4);
    const refs  = (cve.references||[]).find(r=>r.url&&r.url.includes('nvd.nist.gov'))?.url
                  || `https://nvd.nist.gov/vuln/detail/${esc(id)}`;
    const kev   = kevIndex && kevIndex[id];
    const color = cvssColor(score);
    const pct   = score != null ? Math.min(100, (score/10)*100).toFixed(1) : 0;
    const sc    = sevClass(sev);

    return `<div class="cve-card" id="cve-card-${esc(id)}">
      <div class="cve-top">
        <span class="cve-id">${esc(id)}</span>
        <span class="cve-title">${esc(title)}</span>
        <span class="cve-sev ${sc}">${esc(sev)}</span>
      </div>
      ${kev ? `<div class="cve-meta"><span class="cve-chip kev"><span class="ih-dot"></span> &nbsp;🚨 ACTIVELY EXPLOITED · CISA KEV</span></div>` : ''}
      <div class="cve-desc">${esc(desc)}</div>
      ${score != null ? `
      <div class="cve-cvss">
        <span class="cve-cvss-label">CVSS ${cvssData.version||'3.x'}</span>
        <div class="cve-cvss-bar"><div class="cve-cvss-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="cve-cvss-score" style="color:${color}">${score.toFixed(1)}</span>
      </div>` : ''}
      ${cwes.length ? `<div class="cve-meta">${cwes.map(c=>{
        const m = c.match(/CWE-(\d+)/i);
        return m
          ? `<span class="cve-chip cwe-chip-link" onclick="window.openCWERef('${m[1]}')" title="View CWE taxonomy">${esc(c)} ↗</span>`
          : `<span class="cve-chip">${esc(c)}</span>`;
      }).join('')}</div>` : ''}
      ${_cveStandardsBadges(cwes)}
      ${kev ? `<div class="kev-detail" id="kev-detail-${esc(id)}">
        <strong>Vulnerability Name:</strong> ${esc(kev.vulnerabilityName||'')} &nbsp;·&nbsp;
        <strong>Vendor:</strong> ${esc(kev.vendorProject||'')} &nbsp;·&nbsp;
        <strong>Product:</strong> ${esc(kev.product||'')} &nbsp;·&nbsp;
        <strong>Date Added:</strong> ${esc(kev.dateAdded||'')} &nbsp;·&nbsp;
        <strong>Due Date:</strong> ${esc(kev.dueDate||'')}
        ${kev.notes ? `<br><strong>Notes:</strong> ${esc(kev.notes)}` : ''}
      </div>` : ''}
      <div class="cve-actions">
        <button class="primary" onclick="window.intelWriteFinding('${esc(id)}')">✍️ Write Finding</button>
        <button onclick="window.showCVEPlaybookLinks('${esc(id)}',this)">📚 Playbook</button>
        <button onclick="window.open('${esc(refs)}','_blank','noopener noreferrer')">🔗 NVD Details</button>
        ${kev ? `<button onclick="document.getElementById('kev-detail-${esc(id)}').classList.toggle('show')">🚨 KEV Info</button>` : ''}
      </div>
    </div>`;
  }

  /* ── KEV entry renderer ── */
  function renderKEVEntry(entry){
    return `<div class="kev-entry">
      <div class="kev-entry-top">
        <span class="kev-cve-id">${esc(entry.cveID||'')}</span>
        <span class="kev-name">${esc(entry.vulnerabilityName||'')}</span>
        <span class="kev-date">${esc(entry.dateAdded||'')}</span>
      </div>
      <div class="kev-product">${esc(entry.vendorProject||'')} · ${esc(entry.product||'')}</div>
      <div class="cve-actions" style="margin-top:6px">
        <button class="primary" onclick="window.intelWriteFinding('${esc(entry.cveID||'')}')">✍️ Write Finding</button>
        <button onclick="window.ihLookupCVECard('${esc(entry.cveID||'')}')">🔍 Full CVE Details</button>
      </div>
    </div>`;
  }

  /* ── Main hub view renderer ── */
  function renderIntelHubMain(resultsHTML, query, activeNav){
    activeNav = activeNav || 'feed';
    document.getElementById('card').innerHTML = `
      <div class="ih-layout">
        <nav class="ih-sub-nav">
          <div class="ih-sub-nav-brand">
            <div class="ih-sub-nav-icon">🛡️</div>
            <div>
              <div class="ih-sub-nav-title">Intel Hub</div>
              <div class="ih-sub-nav-subtitle">AppSec Intelligence</div>
            </div>
          </div>
          <div class="ih-nav-group">
            <div class="ih-nav-group-label">Threat Intelligence</div>
            <button class="ih-nav-item${activeNav==='feed'?' active':''}" id="ihn-feed" onclick="window.ihNav('feed',this)">
              <span class="ih-nav-ico">📡</span> CVE Feed
              <span class="ih-live-pill"><span class="ih-live-dot2"></span>LIVE</span>
            </button>
            <button class="ih-nav-item${activeNav==='critical'?' active':''}" id="ihn-critical" onclick="window.ihNav('critical',this)">
              <span class="ih-nav-ico">🔴</span> Critical CVEs
            </button>
            <button class="ih-nav-item${activeNav==='kev'?' active':''}" id="ihn-kev" onclick="window.ihNav('kev',this)">
              <span class="ih-nav-ico">🚨</span> CISA KEV Feed
            </button>
          </div>
          <div class="ih-nav-divider"></div>
          <div class="ih-nav-group">
            <div class="ih-nav-group-label">Knowledge Base</div>
            <div class="ih-nav-group-title">
              <span class="ih-nav-ico">🧩</span> CWE Taxonomy
            </div>
            <button class="ih-nav-item ih-nav-sub${activeNav==='cwe'?' active cwe-mode':''}" id="ihn-cwe" onclick="window.ihNav('cwe',this)">
              <span class="ih-nav-sub-arrow">›</span>OWASP Web App 2021
            </button>
            <button class="ih-nav-item ih-nav-sub${activeNav==='api'?' active api-mode':''}" id="ihn-api" onclick="window.ihNav('api',this)">
              <span class="ih-nav-sub-arrow">›</span>OWASP API 2023
            </button>

  /* Generate standards badges HTML for a list of CWE strings like ['CWE-89','CWE-79'] */
  function _cveStandardsBadges(cwes){
    if (!cwes || !cwes.length) return '';
    const seenWA = new Set(), seenAPI = new Set(), seenLLM = new Set(), seenSANS = new Map();
    for (const c of cwes){
      const m = c.match(/CWE-(\d+)/i);
      if (!m) continue;
      const id = m[1];
      const info = CWE_DB[id];
      if (info && info[1]) seenWA.add(info[1]);
      if (_CWE_TO_API[id]) seenAPI.add(_CWE_TO_API[id]);
      if (_CWE_TO_LLM[id]) seenLLM.add(_CWE_TO_LLM[id]);
      if (_SANS_RANK[id]) seenSANS.set(id, _SANS_RANK[id]);
    }
    const badges = [];
    for (const cat of seenWA){
      const name = OWASP_CAT[cat] ? OWASP_CAT[cat][0] : cat;
      badges.push(`<span class="cve-std-badge wa" onclick="event.stopPropagation();window.openCWERef('cwe')" title="OWASP Web App 2021">${esc(cat)}: ${esc(name.length>28?name.slice(0,28)+'…':name)}</span>`);
    }
    for (const cat of seenAPI){
      const name = OWASP_API_DB[cat] ? OWASP_API_DB[cat][0] : cat;
      badges.push(`<span class="cve-std-badge api" onclick="event.stopPropagation();window.ihNav('api')" title="OWASP API Security 2023">${esc(cat)}: ${esc(name.length>28?name.slice(0,28)+'…':name)}</span>`);
    }
    for (const cat of seenLLM){
      const name = OWASP_LLM_DB[cat] ? OWASP_LLM_DB[cat][0] : cat;
      badges.push(`<span class="cve-std-badge llm" onclick="event.stopPropagation();window.ihNav('llm')" title="OWASP LLM Top 10 2025">${esc(cat)}: ${esc(name.length>28?name.slice(0,28)+'…':name)}</span>`);
    }
    for (const [id, rank] of seenSANS){
      badges.push(`<span class="cve-std-badge sans" onclick="event.stopPropagation();window.renderCWEDetail('${esc(id)}')" title="CWE/SANS Top 25">SANS #${rank} · CWE-${esc(id)}</span>`);
    }
    if (!badges.length) return '';
    return `<div class="cve-standards"><span class="cve-std-label">Standards</span>${badges.join('')}</div>`;
  }

      res.innerHTML = cves.map(renderCVECard).join('');

  /* ── Chatbot helper — used by chat widget ── */
  window.lookupCVEForChat = async function(cveId){
    try {
      loadKEV(); /* start silently — KEV flag is optional in chat response */
      const cve = await nvdById(cveId);
      if (!cve) return `❌ **${esc(cveId)}** was not found in the NVD database. Verify the CVE ID and try again.`;
      const descs  = cve.descriptions || [];
      const desc   = (descs.find(d=>d.lang==='en')||descs[0]||{}).value || 'No description.';
      const metrics= cve.metrics || {};
      const cvssD  = (metrics.cvssMetricV31||metrics.cvssMetricV30||metrics.cvssMetricV2||[])[0]?.cvssData || {};
      const score  = cvssD.baseScore != null ? cvssD.baseScore.toFixed(1) : 'N/A';
      const sev    = (metrics.cvssMetricV31||metrics.cvssMetricV30||[])[0]?.cvssData?.baseSeverity || 'N/A';
      const cwes   = (cve.weaknesses||[]).flatMap(w=>w.description||[]).filter(d=>d.lang==='en').map(d=>d.value).slice(0,4).join(', ') || 'N/A';
      const kev    = kevIndex && kevIndex[cveId.toUpperCase()];
      const line   = '─'.repeat(36);
      let out = `🔍 **CVE Lookup — ${cveId}**\n${line}\n\n`;
      out += `**Severity:** ${sev}  ·  **CVSS Score:** ${score}\n\n`;
      if (kev) out += `🚨 **CISA KEV** — This vulnerability is on the Known Exploited Vulnerabilities catalogue!\n**Vendor/Product:** ${kev.vendorProject||''} / ${kev.product||''}\n**Date Added:** ${kev.dateAdded||''}  ·  **Due Date:** ${kev.dueDate||''}\n\n`;
      out += `**Description:**\n${desc}\n\n`;
      if (cwes !== 'N/A') out += `**CWE:** ${cwes}\n\n`;
      out += `**NVD Reference:** https://nvd.nist.gov/vuln/detail/${cveId}\n\n`;
      out += `💡 *Type "write finding for ${cveId}" to generate a structured security report.*`;
      return out;
    } catch(e){
      return `⚠️ Failed to retrieve **${cveId}** from NVD: ${e.message}. The NVD API is rate-limited (5 req/30 s) — try again in a moment.`;
    }
  };

  /* shared tab switcher — prefix = 'cdet-' or 'odet-' */
  window._detTab = function(btn, prefix){

  window._loadCWECVEs = async function(cweId){

    panel.innerHTML = loadingHTML('Searching NVD for CWE-'+esc(cweId)+'…');
    try {
      await new Promise(r=>setTimeout(r,NVD_DELAY));
      const cves = await nvdSearch('CWE-'+cweId);

        ? `<div class="ih-section-title">CVEs referencing CWE-${esc(cweId)} (${cves.length})</div>`+cves.map(renderCVECard).join('')

  window.cweSearch = function(){
    const inp = document.getElementById('cweSearchInput');
    const q = (inp ? inp.value.trim() : '');
    if (!q) return;
    const numM = q.match(/^(?:CWE[-\s]?)?(\d+)$/i);
    if (numM){ window.renderCWEDetail(numM[1]); return; }
    const qL = q.toLowerCase();
    const hits = Object.entries(CWE_DB).filter(([id,d])=> d[0].toLowerCase().includes(qL));
    ensureIHLayout('cwe');
    if (!hits.length){ document.getElementById('ihResults').innerHTML=`<div class="cwe-browser"><button class="cwe-back-btn" onclick="window.openCWERef()">← CWE Browser</button><div class="ih-empty">No CWE matched "<strong>${esc(q)}</strong>". Try a number or shorter keyword.</div></div>`; return; }
    if (hits.length===1){ window.renderCWEDetail(hits[0][0]); return; }
    document.getElementById('ihResults').innerHTML = `
      <div class="cwe-browser">
        <button class="cwe-back-btn" onclick="window.openCWERef()">← CWE Browser</button>
        <div class="ih-section-title">${hits.length} results for "${esc(q)}"</div>

  window.cweToPlaybook = function(name){
    /* 1 — filter sidebar */
    const sb = document.getElementById('sidebarSearch');
    if (sb){ sb.value = name; if(typeof filterVC==='function') filterVC(name); }
    /* 2 — inline results in detail card */
    const div = document.getElementById('cwePlaybookResults');
    if (!div) return;
    const vd = window._vcData;
    if (!vd){ div.innerHTML='<div class="ih-empty" style="font-size:12px">Playbook data not loaded yet.</div>'; return; }
    const words = name.toLowerCase().split(/\s+/).filter(w=>w.length>3);
    const hits = [];
    for (const src of ['waapi','llm','wa']){
      const d = vd[src]; if (!d) continue;
      const label = src==='waapi'?'API':src==='llm'?'LLM':'WebApp';
      for (const cat of d.categories||[]){
        for (const v of cat.vulnerabilities||[]){
          const t = ((v.name||'')+' '+(v.description||'')).toLowerCase();
          const score = words.reduce((s,w)=>s+(t.includes(w)?1:0),0);
          if (score>0) hits.push({v, src, label, score});
        }
      }
    }
    hits.sort((a,b)=>b.score-a.score);
    if (!hits.length){
      div.innerHTML=`<div class="ih-empty" style="font-size:12px">No direct playbook match — sidebar filtered for broader results.</div>`;
    } else {
      div.innerHTML=`<div style="font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">📚 Playbook Matches (${hits.length > 5 ? 'top 5 of '+hits.length : hits.length})</div>`
        +hits.slice(0,5).map(m=>`
        <div class="cve-plink-item">
          <span class="cve-plink-name">${esc(m.v.name||'')}</span>
          <span class="cve-plink-src">${esc(m.label)}</span>
          <span class="cve-sev ${esc(m.v.severity||'')}" style="font-size:9px">${esc(m.v.severity||'')}</span>
        </div>`).join('');
    }
  };

  /* ── Feature 5A: CVE → Playbook cross-links ── */
  const _pSrcLabel = s => s==='waapi'?'API Security':s==='wa'?'Web App':s==='llm'?'LLM Security':'';
  const _STOP = new Set(['the','and','for','with','that','this','are','can','not','its','via','from','when','been','have','into','does','will','may','also','such','then','them','they','each','over','used','use','all','any','which','without','where','their','other','being','than','more','allows','code','data','user','users','system','product','server','client','web','api','application','allow','using','through','those','these','could','would','should']);

  function findPlaybookMatches(cve){
    const vd = window._vcData;
    if (!vd) return [];
    const descs = cve.descriptions||[];
    const desc  = ((descs.find(d=>d.lang==='en')||descs[0]||{}).value||'').toLowerCase();
    const cwes  = (cve.weaknesses||[]).flatMap(w=>w.description||[]).filter(d=>d.lang==='en').map(d=>d.value.toLowerCase()).join(' ');
    const text  = desc+' '+cwes;
    const results = [];
    for (const src of ['waapi','wa','llm']){
      const d = vd[src];
      if (!d) continue;
      for (const cat of d.categories||[]){
        for (const v of cat.vulnerabilities||[]){
          const vWords = (v.name||'').toLowerCase().split(/\s+/).filter(w=>w.length>3&&!_STOP.has(w));
          let score = 0;
          for (const w of vWords){ if (text.includes(w)) score+=2; }
          // bonus: CWE name match
          const vDesc = (v.description||'').toLowerCase();
          for (const w of vDesc.split(/\s+/).filter(x=>x.length>4&&!_STOP.has(x))){
            if (text.includes(w)) score++;
          }
          if (score>0) results.push({v, cat, src, score});
        }
      }
    }
    return results.sort((a,b)=>b.score-a.score).slice(0,3);
  }

  window.showCVEPlaybookLinks = async function(cveId, btn){
    const card = btn.closest('.cve-card');
    if (!card) return;
    const existing = card.querySelector('.cve-playbook-panel');
    if (existing){ existing.remove(); btn.textContent='📚 Playbook'; return; }
    btn.textContent = '⏳';
    try {
      const cve = await nvdById(cveId);
      btn.textContent = '📚 Playbook';
      const panel = document.createElement('div');
      panel.className = 'cve-playbook-panel';
      const matches = cve ? findPlaybookMatches(cve) : [];
      if (!matches.length){
        panel.innerHTML = '<div class="cve-plink-label">📚 Related Playbook Entries</div><span style="font-size:11px;color:var(--muted)">No direct match found — try the CWE search or chatbot.</span>';
      } else {
        panel.innerHTML = '<div class="cve-plink-label">📚 Related Playbook Entries</div>'
          + matches.map(m=>{
            const sc = (m.v.severity||'').charAt(0).toUpperCase()+(m.v.severity||'').slice(1).toLowerCase();
            return `<div class="cve-plink-item">
              <span class="cve-plink-name">${esc(m.v.name)}</span>
              <span class="cve-plink-src">${esc(_pSrcLabel(m.src))}</span>
              <span class="cve-sev ${esc(sc)}" style="font-size:9px">${esc(m.v.severity||'')}</span>
            </div>`;
          }).join('');
      }
      card.appendChild(panel);
    } catch(e){ btn.textContent='📚 Playbook'; }
  };

  /* ── Feature 6: Generate finding from CVE (async, used by chatbot) ── */
  window.generateFindingFromCVE = async function(cveId){
    try {
      loadKEV();
      const cve = await nvdById(cveId);
      if (!cve) return `❌ **${cveId}** not found in NVD. Please verify the CVE ID and try again.`;

      const descs  = cve.descriptions||[];
      const desc   = (descs.find(d=>d.lang==='en')||descs[0]||{}).value||'No description available.';
      const metrics= cve.metrics||{};
      const m31    = (metrics.cvssMetricV31||metrics.cvssMetricV30||[])[0];
      const m2     = (metrics.cvssMetricV2||[])[0];
      const cvssD  = m31?.cvssData || m2?.cvssData || {};
      const score  = cvssD.baseScore!=null ? cvssD.baseScore.toFixed(1) : 'N/A';
      const sev    = m31?.cvssData?.baseSeverity
                     || (cvssD.baseScore>=9?'CRITICAL':cvssD.baseScore>=7?'HIGH':cvssD.baseScore>=4?'MEDIUM':'LOW')||'UNKNOWN';
      const vector = cvssD.vectorString||'N/A';
      const cwes   = (cve.weaknesses||[]).flatMap(w=>w.description||[]).filter(d=>d.lang==='en').map(d=>d.value).slice(0,3).join(', ')||'N/A';
      const kev    = kevIndex && kevIndex[cveId];
      const matches = findPlaybookMatches(cve);
      const top    = matches[0];
      const sevIcon= {'CRITICAL':'🔴','HIGH':'🟠','MEDIUM':'🟡','LOW':'🟢'}[sev]||'⚪';
      const line   = '─'.repeat(46);

      let out = `📋 **SECURITY FINDING REPORT**\n${line}\n\n`;
      out += `**CVE ID:** \`${cveId}\`\n`;
      out += `**Severity:** ${sevIcon} **${sev}**  ·  **CVSS Score:** ${score}\n`;
      if (vector!=='N/A') out += `**CVSS Vector:** \`${vector}\`\n`;
      out += `**CWE Classification:** ${cwes}\n`;
      if (kev){
        out += `**CISA KEV Status:** 🚨 **ACTIVELY EXPLOITED**\n`;
        out += `**Vendor / Product:** ${kev.vendorProject||'—'} / ${kev.product||'—'}\n`;
        out += `**KEV Added:** ${kev.dateAdded||'—'}  ·  **Patch Due:** ${kev.dueDate||'—'}\n`;
      }
      out += `\n**Description:**\n> ${desc}\n\n`;
      if (top){
        out += `**Playbook Reference:** ${top.v.name} (${top.v.severity||''}) — ${_pSrcLabel(top.src)}\n\n`;
        if (top.v.remediation) out += `**Remediation Guidance:**\n${top.v.remediation}\n\n`;
      }
      out += `**References:**\n• NVD: https://nvd.nist.gov/vuln/detail/${cveId}`;
      if (kev) out += `\n• CISA KEV: https://www.cisa.gov/known-exploited-vulnerabilities-catalog`;
      return out;
    } catch(e){
      return `⚠️ Could not generate finding for **${cveId}**: ${e.message}. Try again in a moment (NVD rate limit: 5 req/30 s).`;
    }
  };

  /* expose CWE lookup as chatbot helper */
  window.lookupCWEForChat = function(cweId){
    const d = CWE_DB[String(cweId)];
    if (!d) return null; /* fall through to existing searchByCWE */
    const [name, owasp, sev, parent, desc] = d;
    const oi = owasp ? OWASP_CAT[owasp] : null;
    const children = Object.entries(CWE_DB).filter(([id,cd])=>cd[3]===String(cweId));
    const line = '─'.repeat(38);
    let out = `🧩 **CWE-${cweId} · ${name}**\n${line}\n\n`;
    out += `**Severity Pattern:** ${sev}`;
    if (oi) out += `  ·  **OWASP 2021:** ${owasp} — ${oi[0]}`;
    out += `\n\n**Description:**\n> ${desc}\n\n`;
    if (parent && CWE_DB[parent]) out += `**Parent Weakness:** CWE-${parent} · ${CWE_DB[parent][0]}\n\n`;
    if (children.length) out += `**Child Weaknesses:** ${children.map(([id,cd])=>`CWE-${id} (${cd[0]})`).join(', ')}\n\n`;
    out += `💡 *Open the **CWE Taxonomy** in the sidebar for the full reference, parent/child tree, and live NVD CVE search.*`;
    return out;
  };

})();

/* ── Load Playbook vuln-classification data so Playbook button works ── */
(function loadPlaybookData(){
  const BASE = 'https://raw.githubusercontent.com/NAGGI-AI/API-Security-Playbook/main/vuln-classification/';
  const FILES = { waapi: 'api.json', llm: 'llm.json', wa: 'webapp.json' };
  window._vcData = null;
  const loaded = {};
  Object.entries(FILES).forEach(function([key, file]){
    fetch(BASE + file)
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(data){ loaded[key] = data; })
      .catch(function(e){ console.warn('[IntelHub] Could not load playbook data for', key, e); })
      .finally(function(){
        if (Object.keys(loaded).length === Object.keys(FILES).length){
          window._vcData = loaded;
        }
      });
  });
})();

window.addEventListener('DOMContentLoaded', function() {
  window.openIntelHub();
});
</script>
